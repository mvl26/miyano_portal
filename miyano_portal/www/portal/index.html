<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <meta name="theme-color" content="#ffffff" />
  <title>Cổng khách hàng Miyano</title>
  <link rel="stylesheet" href="/assets/miyano_portal/frontend/index.css?v={{ build_version }}" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f6f9; }
    #app { min-height: 100vh; }
    .mp-boot { display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; min-height: 100vh; }
    .mp-boot-mark { width: 40px; height: 40px; border-radius: 10px; background: #003366; display: grid; place-items: center; }
    .mp-boot-mark i { width: 13px; height: 13px; background: #e5484d; transform: rotate(45deg); border-radius: 2px; display: block; animation: mp-pulse 1.1s ease-in-out infinite; }
    @keyframes mp-pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .mp-boot-mark i { animation: none; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="mp-boot" role="status" aria-label="Đang tải cổng khách hàng"><div class="mp-boot-mark"><i></i></div></div>
  </div>
  <script>window.mp_csrf = "{{ csrf_token }}";</script>
  <script type="module" src="/assets/miyano_portal/frontend/index.js?v={{ build_version }}"></script>
</body>
</html>
