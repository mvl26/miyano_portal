<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <meta name="theme-color" content="#1f4e79" />
  <title>Cổng khách hàng Miyano</title>
  <link rel="stylesheet" href="/assets/miyano_portal/frontend/index.css?v={{ build_version }}" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f6f9; }
    #app { min-height: 100vh; }
    .mp-boot { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    .mp-boot-spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #2d6da3; border-radius: 50%; animation: mp-spin 0.8s linear infinite; }
    @keyframes mp-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="mp-boot"><div class="mp-boot-spinner"></div></div>
  </div>
  <script>window.mp_csrf = "{{ csrf_token }}";</script>
  <script type="module" src="/assets/miyano_portal/frontend/index.js?v={{ build_version }}"></script>
</body>
</html>
