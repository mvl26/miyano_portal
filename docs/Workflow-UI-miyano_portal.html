<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miyano Portal — Mô phỏng thao tác workflow trên giao diện</title>
<style>
/* ===========================================================================
   Design system lấy đúng từ miyano_portal/public/css/portal.css để màn mô phỏng
   trông giống cổng thật. Chỉ dựng nhánh desktop — tài liệu đào tạo không xem
   trên điện thoại.
   =========================================================================== */
:root{
  --blue:#1f4e79; --blue2:#2d6da3; --bg:#f4f6f9; --line:#e2e8f0;
  --gray:#64748b; --dark:#1e293b; --green:#16a34a; --orange:#ea580c; --red:#dc2626;
  --miyano:#8a5a1d; --miyano2:#a97230; --miyano-bg:#f7efe3;
  --guide:#0f6b5f; --guide-bg:#e8f2f0;
  --rail-h:196px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',Roboto,Arial,sans-serif;color:var(--dark);font-size:14px;
  background:#0e1a1f;overflow:hidden;
}
a{text-decoration:none}
button{cursor:pointer;font-size:14px;font-family:inherit}

/* ---------- Khung ngoài: màn hình mô phỏng + thanh hướng dẫn ---------- */
#stage{position:fixed;left:0;right:0;top:0;bottom:var(--rail-h);overflow:auto;background:var(--bg)}
#rail{position:fixed;left:0;right:0;bottom:0;height:var(--rail-h);background:#0e1a1f;color:#e2e8f0;
      border-top:3px solid var(--guide);display:flex;z-index:200}

/* ---------- Thanh hướng dẫn ---------- */
.rail-main{flex:1;padding:14px 22px;display:flex;flex-direction:column;min-width:0}
.rail-top{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.stepno{font-family:ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.08em;
        background:var(--guide);color:#fff;padding:3px 9px;border-radius:5px;white-space:nowrap}
.actor{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.actor.khach{background:#dbeafe;color:#1d4ed8}
.actor.miyano{background:#fde9c8;color:#8a5a1d}
.actor.auto{background:#cbd5e1;color:#334155}
.rail-title{font-size:16px;font-weight:700;color:#fff;line-height:1.35}
.rail-desc{font-size:13.5px;color:#b6c4c2;line-height:1.55;overflow-y:auto;flex:1}
.rail-desc b{color:#fff}
.rail-desc code{font-family:ui-monospace,monospace;font-size:12px;background:#1c2f35;color:#8fd3c6;padding:1px 5px;border-radius:4px}
.br{display:inline-block;font-family:ui-monospace,monospace;font-size:11px;font-weight:700;
    background:#12403a;color:#6ee7b7;border:1px solid #1d5b52;padding:1px 6px;border-radius:4px;margin-right:5px}
.br.warnbr{background:#4a1f1a;color:#fca5a5;border-color:#7a2f26}

.rail-side{width:300px;flex:0 0 300px;border-left:1px solid #1c2f35;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.railbtns{display:flex;gap:8px}
.railbtns button{flex:1;border:none;border-radius:8px;padding:10px 8px;font-weight:700}
#btnPrev{background:#1c2f35;color:#cbd5e1}
#btnPrev:hover:not(:disabled){background:#26424a}
#btnNext{background:var(--guide);color:#fff}
#btnNext:hover:not(:disabled){background:#12897a}
.railbtns button:disabled{opacity:.35;cursor:not-allowed}
.progress{height:6px;background:#1c2f35;border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--guide);transition:width .25s}
.railmeta{font-size:11.5px;color:#7b8a87;line-height:1.5}
.railmeta a{color:#6ee7b7}
.chip-jump{display:flex;flex-wrap:wrap;gap:4px}
.chip-jump button{border:1px solid #1c2f35;background:transparent;color:#7b8a87;border-radius:5px;
                  padding:2px 7px;font-size:11px;font-family:ui-monospace,monospace}
.chip-jump button.on{background:var(--guide);color:#fff;border-color:var(--guide)}
.chip-jump button:hover{color:#fff}

/* ---------- Chỉ dẫn bấm ---------- */
[data-hl].hl{position:relative;outline:3px solid #0f6b5f;outline-offset:3px;border-radius:8px;
             animation:pulse 1.7s infinite;cursor:pointer;z-index:5}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,107,95,.45)}50%{box-shadow:0 0 0 9px rgba(15,107,95,0)}}
.tipline{font-size:12.5px;color:#8fd3c6;background:#12403a;border:1px solid #1d5b52;
         border-radius:6px;padding:5px 10px;line-height:1.4}
.tipline b{color:#fff}

/* ---------- Vỏ cổng khách hàng ---------- */
.side{position:absolute;left:0;top:0;bottom:0;width:230px;background:var(--blue);color:#fff;padding:20px 0;display:flex;flex-direction:column;z-index:10}
.side .logo{font-size:20px;font-weight:800;color:#fff;padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.15)}
.side .logo span{color:#fca5a5}
.nav{margin-top:12px;flex:1}
.nav a{display:flex;justify-content:space-between;align-items:center;color:#cbd5e1;padding:11px 20px;font-weight:500;gap:8px}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:rgba(255,255,255,.15);color:#fff;border-left:3px solid #fff}
.cartn{background:#e11d48;color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700;min-width:20px;text-align:center}
.who{padding:14px 20px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:#cbd5e1;line-height:1.5}
.main{margin-left:230px;padding:22px 26px 40px;max-width:1180px}

/* Vỏ Desk của Miyano — khác hẳn để không ai nhầm đang xem màn của ai */
.side.desk{background:var(--miyano)}
.side.desk .logo span{color:#fcd9a1}
.deskbar{margin-left:230px;background:var(--miyano-bg);border-bottom:1px solid #e0cba6;color:#7a4f18;
         padding:9px 26px;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.deskbar b{color:#5c3a10}

.actorbar{margin-left:230px;background:#dbeafe;border-bottom:1px solid #bfdbfe;color:#1d4ed8;
          padding:9px 26px;font-size:12.5px;font-weight:600}

/* ---------- Thành phần dùng chung (theo portal.css) ---------- */
h2{font-size:20px;margin-bottom:4px;color:var(--dark)}
h3{font-size:16px}
.sub{color:var(--gray);font-size:13px;margin-bottom:18px}
.tag{font-size:11px;color:var(--gray)}
.right{text-align:right}
.muted{color:var(--gray)}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.card.flush{padding:0;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#f1f5f9;text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#475569;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.clickable:hover td{background:#f8fafc;cursor:pointer}
input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;font-size:14px;width:100%;background:#fff;font-family:inherit;color:var(--dark)}
input:disabled,select:disabled,textarea:disabled{background:#f8fafc;color:#94a3b8}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:4px}
.flex{display:flex;gap:10px;align-items:center}
.sb{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-gray{background:#e2e8f0;color:#475569}
.b-blue{background:#dbeafe;color:#1d4ed8}
.b-orange{background:#ffedd5;color:#c2410c}
.b-green{background:#dcfce7;color:#15803d}
.b-red{background:#fee2e2;color:#b91c1c}
.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--blue2)}
.btn-o{background:#fff;color:var(--blue);border:1px solid var(--blue);border-radius:8px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-o:hover{background:#f1f5f9}
.btn-sm{padding:6px 12px;border-radius:6px;font-size:13px}
.btn-danger{color:var(--red);border-color:var(--red);background:#fff}
.btn-danger:hover{background:#fef2f2}
.btn:disabled,.btn-o:disabled{opacity:.45;cursor:not-allowed}
.btn.desk{background:var(--miyano)}.btn.desk:hover{background:var(--miyano2)}
.btn-o.desk{color:var(--miyano);border-color:var(--miyano)}
.bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue2)}
.warn{color:var(--red);font-size:12px;font-weight:600}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:13px;color:#92400e;margin:12px 0}
.note.red{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.note.gr{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi .n{font-size:26px;font-weight:800;color:var(--blue)}
.kpi .t{color:var(--gray);font-size:13px;margin-top:2px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
.step{display:inline-flex;align-items:center;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;background:#fff}
.step button{border:none;background:#f1f5f9;width:30px;height:34px;font-size:16px;color:#475569}
.step input{border:none;width:56px;text-align:center;border-radius:0;padding:8px 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;color:#475569}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.success{text-align:center;padding:40px 24px}

/* Modal */
.modal{position:fixed;left:0;right:0;top:0;bottom:var(--rail-h);background:rgba(15,23,42,.5);
       display:flex;align-items:center;justify-content:center;z-index:120;padding:20px}
.modal .card{max-width:520px;width:100%;margin:0;max-height:100%;overflow:auto}

/* Toast */
#toast{position:fixed;right:22px;bottom:calc(var(--rail-h) + 18px);z-index:180;max-width:420px}
.toast{border-radius:10px;padding:12px 16px;font-size:13.5px;margin-top:8px;box-shadow:0 8px 26px rgba(0,0,0,.25);line-height:1.5}
.toast.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.toast.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}
.toast b{display:block;margin-bottom:2px}

/* Bảng phụ trong ô mở rộng */
.subtable{background:#f8fafc;padding:12px 16px}
.subtable table{background:transparent}
.subtable th{background:#eef2f7}
</style>
</head>
<body>

<div id="stage"><div id="app"></div></div>
<div id="toast"></div>

<div id="rail">
  <div class="rail-main">
    <div class="rail-top">
      <span class="stepno" id="stepno">BƯỚC 1/24</span>
      <span class="actor khach" id="actor">Khách hàng</span>
      <span class="rail-title" id="title">…</span>
    </div>
    <div class="rail-desc" id="desc">…</div>
  </div>
  <div class="rail-side">
    <div class="progress"><i id="prog" style="width:0%"></i></div>
    <div class="tipline" id="tip">…</div>
    <div class="railbtns">
      <button id="btnPrev">← Lùi</button>
      <button id="btnNext">Tiếp →</button>
    </div>
    <div class="chip-jump" id="jump"></div>
    <div class="railmeta">← → để chuyển bước · dữ liệu demo trùng <code style="color:#8fd3c6">setup/demo_kho_flow.py</code></div>
  </div>
</div>

<script>
/* ===========================================================================
   DỮ LIỆU DEMO — khai báo MỘT chỗ, mọi màn hình đọc từ đây.
   Trùng với setup/demo_kho_flow.py: khách "Bệnh viện Đa khoa Minh Đức (DEMO)",
   kho "Kho Khoa Dược" mã MD, bốn vật tư, các lô trải theo ba mốc hạn dùng.
   =========================================================================== */
const DEMO = {
  khach: 'Bệnh viện Đa khoa Minh Đức (DEMO)',
  khachCode: 'CUST-2026-00018',
  email: 'bvminhduc@demo.miyano',
  kho: 'KKH-00007',
  tenKho: 'Kho Khoa Dược',
  maKho: 'MD',
  thuKho: 'Trần Thị Bích Ngọc',
  hdnt: 'BO-2026-00007',
  hdntFrom: '2026-01-01', hdntTo: '2026-12-31',
  diaChi: '88 Nguyễn Trãi, Thanh Xuân, Hà Nội',
  soDon: 'SAL-ORD-2026-00042',
  soDN: 'MAT-DN-2026-00031',
  soPN: 'PN-MD-2026-00009',
  soPNdao: 'PN-MD-2026-00010',
  soPX: 'PX-MD-2026-00004',
  po: 'DT-2026-0715',
  ngayGiao: '2026-08-14',
  homNay: '2026-08-10',
}

// Danh mục theo hợp đồng nguyên tắc (giá + hạn mức).
const CATALOG = [
  { code:'MYN-GLOVE-M', name:'Găng tay khám nitrile size M – hộp 100 cái', nhom:'Vật tư tiêu hao', uom:'Hộp', vat:5,  rate:78000,   total:2000, remaining:1240 },
  { code:'MYN-SYR-10',  name:'Bơm tiêm 10ml G21 – hộp 100 cái',            nhom:'Vật tư tiêu hao', uom:'Hộp', vat:5,  rate:72000,   total:1500, remaining:890  },
  { code:'MYN-ALT',     name:'Hoá chất sinh hoá ALT (GPT) – hộp 4×50ml',   nhom:'Hoá chất xét nghiệm', uom:'Hộp', vat:8, rate:1050000, total:60,   remaining:6 },
]

// Danh mục vật tư của kho khách. MD-BONG-01 là mã RIÊNG của bệnh viện —
// item_code rỗng, không hề có Item nào bên ERPNext.
const VATTU = {
  'MYN-GLOVE-M':{ ten:'Găng tay khám nitrile size M – hộp 100 cái', dvt:'Hộp',  item:'MYN-GLOVE-M' },
  'MYN-SYR-10' :{ ten:'Bơm tiêm 10ml G21 – hộp 100 cái',            dvt:'Hộp',  item:'MYN-SYR-10'  },
  'MYN-ALT'    :{ ten:'Hoá chất sinh hoá ALT (GPT) – hộp 4×50ml',   dvt:'Hộp',  item:'MYN-ALT'     },
  'MD-BONG-01' :{ ten:'Bông y tế cuộn 500g (bệnh viện tự mua)',     dvt:'Cuộn', item:null          },
}

// Tồn đầu kỳ theo lô — cố ý trải: đã hết hạn / sắp hết hạn / còn hạn dài.
function tonBanDau() {
  return [
    { vt:'MYN-GLOVE-M', lo:'GL2504-A',     han:'2026-07-16', sl:18,  gia:68000  },
    { vt:'MYN-GLOVE-M', lo:'GL2508-B',     han:'2026-09-19', sl:60,  gia:70000  },
    { vt:'MYN-GLOVE-M', lo:'GL2601-C',     han:'2028-02-01', sl:120, gia:72000  },
    { vt:'MYN-SYR-10',  lo:'SY2506-A',     han:'2026-10-24', sl:40,  gia:64000  },
    { vt:'MYN-SYR-10',  lo:'SY2512-B',     han:'2027-10-05', sl:90,  gia:66000  },
    { vt:'MYN-ALT',     lo:'ALT2505-A',    han:'2026-07-31', sl:3,   gia:940000 },
    { vt:'MYN-ALT',     lo:'ALT2509-B',    han:'2026-10-09', sl:12,  gia:950000 },
    { vt:'MD-BONG-01',  lo:'BONG-2026-01', han:'2027-06-06', sl:50,  gia:45000  },
  ]
}

/* ---------- Định dạng: lấy đúng từ frontend/src/format.js ---------- */
const fmtVND = v => Number(v||0).toLocaleString('vi-VN') + ' ₫'
const fmtQty = v => Number(v||0).toLocaleString('vi-VN')
function fmtDate(v){ if(!v) return ''; const p=String(v).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v }
function daysUntil(iso){ if(!iso) return null
  return Math.round((new Date(iso+'T00:00:00') - new Date(DEMO.homNay+'T00:00:00'))/86400000) }
function expiryInfo(han){
  if(!han) return {label:'',cls:''}
  const d = daysUntil(han)
  if(d < 0)  return {label:'Đã hết hạn', cls:'b-red',    icon:'⛔'}
  if(d <= 90) return {label:'Sắp hết hạn', cls:'b-orange', icon:'⚠'}
  return {label:'',cls:''}
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

/* ===========================================================================
   TRẠNG THÁI MÔ PHỎNG. Mọi bước đều `apply(S)` lên trạng thái này; khi nhảy
   bước, S được dựng lại từ đầu rồi phát lại — không có đường "hoàn tác" nào
   để lệch.
   =========================================================================== */
function initState(){
  return {
    chrome:'portal', screen:'catalog', modal:null, toasts:[],
    qtys:{}, cart:[],
    order:null, dn:null,
    pnList:[], pxDoc:null, pnDoc:null,
    ton: tonBanDau(),
    pxSL:0, pxLo:null, pxXacNhanHetHan:false, pxThieu:0,
    khoNote:null,
  }
}
let S = initState()
let cur = 0

/* ---------- Trợ giúp trạng thái ---------- */
const tonCua = (S, vt) => S.ton.filter(l => l.vt===vt && l.sl > 0)
const tongTon = (S, vt) => tonCua(S,vt).reduce((a,l)=>a+l.sl,0)
function lotsFEFO(S, vt){
  // FEFO: hạn gần nhất trước, lô KHÔNG có hạn xếp cuối (ledger.get_lot_balances).
  return tonCua(S,vt).slice().sort((a,b)=>{
    if(!a.han && !b.han) return a.lo < b.lo ? -1 : 1
    if(!a.han) return 1
    if(!b.han) return -1
    return a.han < b.han ? -1 : (a.han > b.han ? 1 : 0)
  })
}
function goiYFEFO(S, vt, can){
  let conLai = can
  const rows = lotsFEFO(S,vt).map(l => {
    const deXuat = conLai > 0 ? Math.min(conLai, l.sl) : 0
    conLai = Math.max(0, conLai - deXuat)
    return {...l, deXuat}
  })
  return { rows, thieu: conLai }
}
const cartLines = S => S.cart.map(c => ({...CATALOG.find(i=>i.code===c.code), qty:c.qty}))
const cartSub   = S => cartLines(S).reduce((a,l)=>a+l.qty*l.rate, 0)
const cartVat   = S => Math.round(cartLines(S).reduce((a,l)=>a+l.qty*l.rate*l.vat/100, 0))
const cartTotal = S => cartSub(S) + cartVat(S)

function toast(S, kind, title, msg){ S.toasts.push({kind, title, msg}) }

/* ===========================================================================
   KỊCH BẢN — mỗi bước: ai thao tác, màn nào, giải thích gì, quy tắc nào,
   và bấm vào đâu để đi tiếp.
   =========================================================================== */
const STEPS = [

/* ---------------------------- QT1 · Đặt hàng ---------------------------- */
{
  act:'khach', mua:'QT1', screen:'catalog', hl:'sel-hdnt', tip:'Chọn hợp đồng',
  title:'Chọn hợp đồng nguyên tắc',
  desc:`Khách đăng nhập bằng tài khoản <code>${DEMO.email}</code> và vào màn <b>Đặt hàng</b>.
        Danh mục hàng, đơn giá và hạn mức đều lấy từ <b>hợp đồng nguyên tắc</b> (<code>Blanket Order</code>)
        của chính đơn vị mình — không có mặt hàng nào ngoài hợp đồng.
        <span class="br">BR-O1</span> Hợp đồng phải thuộc đúng đơn vị đang đăng nhập; cổng kiểm lại điều này
        ở phía máy chủ chứ không tin vào lựa chọn gửi lên.`,
  apply(S){ S.screen='catalog' },
},
{

        ${open?`<tr><td colspan="8" class="subtable"><table>

            <tbody>${lotsFEFO(S,r.vt).map(l=>{const e=expiryInfo(l.han);return `<tr>
              <td>${l.lo}</td>
              <td>${l.han?`${fmtDate(l.han)}${e.label?` <span class="badge ${e.cls}" style="margin-left:6px">${e.icon} ${e.label}</span>`:''}`:'<span class="tag">Không thời hạn</span>'}</td>
              <td class="right">${fmtQty(l.sl)}</td><td class="right">${fmtVND(l.gia)}</td></tr>`}).join('')}
            </tbody></table></td></tr>`:''}`
      }).join('')}</tbody></table></div>`
}

function scPNList(S){
  const badge = p => p.docstatus===2 ? ['b-red','Đã huỷ'] : p.docstatus===1 ? ['b-green','Đã ghi sổ'] : ['b-gray','Nháp']
  return `<div class="topbar">
      <div><h2>Phiếu nhập kho</h2><div class="sub">${DEMO.tenKho}</div></div>
      <div class="flex"><button class="btn">＋ Tạo phiếu nhập</button></div></div>
    <div class="card flush"><table>
      <thead><tr><th>Số phiếu</th><th>Ngày</th><th>Loại nhập</th><th>Tham chiếu</th>
        <th class="right">Số dòng</th><th class="right">Tổng tiền</th><th>Trạng thái</th></tr></thead>
      <tbody>${S.pnList.length? S.pnList.map(p=>{
        const [cls,lb]=badge(p)
        const tien=p.rows.reduce((a,r)=>a+r.sl*r.gia,0)
        const hl = p.loai==='Phiếu đảo' ? 'pn-row-dao' : (p.docstatus===0 ? 'pn-row' : '')
        return `<tr class="clickable" ${hl?`data-hl="${hl}"`:''}>
          <td><b>${p.name}</b></td><td>${fmtDate(p.ngay)}</td>
          <td>${p.loai}</td>
          <td class="tag">${p.dn?`${p.dn}<br>${p.so}`:(p.phieuGoc?`Phiếu gốc: ${p.phieuGoc}`:'—')}</td>
          <td class="right">${p.rows.length}</td><td class="right">${fmtVND(tien)}</td>
          <td><span class="badge ${cls}">${lb}</span>${p.daDao?' <span class="badge b-gray">đã đảo</span>':''}</td>
        </tr>`}).join('') : `<tr><td colspan="7" class="tag" style="padding:18px">Chưa có phiếu nhập nào.</td></tr>`}
      </tbody></table></div>`
}

function scPNDetail(S){
  const p = S.pnDoc
  const [cls,lb] = p.docstatus===2?['b-red','Đã huỷ']:p.docstatus===1?['b-green','Đã ghi sổ']:['b-gray','Nháp']
  const tien = p.rows.reduce((a,r)=>a+r.sl*r.gia,0)
  const acts = p.docstatus===0
    ? `<button class="btn" data-hl="btn-ghiso-pn">Ghi sổ</button><button class="btn-o">Lưu nháp</button>`
    : p.docstatus===1
    ? `<button class="btn-o btn-danger" data-hl="btn-huy-pn">Huỷ phiếu</button><button class="btn-o">⬇ In phiếu (PDF)</button>`
    : `<button class="btn-o" disabled>Phiếu đã huỷ</button>`
  return `<div class="topbar">
      <div><h2>${p.name}</h2><div class="sub"><span class="badge ${cls}">${lb}</span>
        ${p.daDao?' <span class="badge b-gray">đã sinh phiếu đảo</span>':''}</div></div>
      <div class="flex">${acts}<button class="btn-o">Quay lại</button></div></div>
    <div class="card">
      <div class="grid2" style="grid-template-columns:1fr 1fr">
        <div><div class="field"><label>Ngày</label><input value="${fmtDate(p.ngay)}" ${p.docstatus?'disabled':''}></div>
          <div class="field"><label>Loại nhập</label>
            <select ${p.docstatus?'disabled':''}><option>${p.loai}</option></select></div></div>
        <div><div class="field"><label>Phiếu giao hàng Miyano</label><input value="${p.dn||'—'}" disabled></div>
          <div class="field"><label>Đơn hàng Miyano</label><input value="${p.so||'—'}" disabled></div></div>
      </div>
      <div class="field" style="margin-top:6px"><label>Diễn giải</label>
        <textarea rows="2" ${p.docstatus?'disabled':''}>Nhận hàng theo phiếu giao ${p.dn||''}</textarea></div>
    </div>
    ${p.docstatus===0?`<div class="flex" style="gap:8px;margin-bottom:14px">
      <button class="btn-o btn-sm">Tải file mẫu</button>
      <button class="btn-o btn-sm">⬆ Nhập từ Excel</button>
      <button class="btn-o btn-sm">⬇ Xuất Excel</button></div>`:''}
    <div class="card flush"><table>
      <thead><tr><th style="min-width:200px">Vật tư</th><th>Số lô</th><th>Hạn dùng</th>
        <th class="right">Số lượng</th><th class="right">Đơn giá</th><th class="right">Thành tiền</th></tr></thead>
      <tbody>${p.rows.map(r=>`<tr>
        <td><b>${r.vt}</b><br><span class="tag">${esc(VATTU[r.vt].ten)}</span></td>
        <td>${r.lo}</td><td>${r.han?fmtDate(r.han):'<span class="tag">Không thời hạn</span>'}</td>
        <td class="right">${fmtQty(r.sl)} ${VATTU[r.vt].dvt}</td>
        <td class="right">${fmtVND(r.gia)}</td><td class="right"><b>${fmtVND(r.sl*r.gia)}</b></td>
      </tr>`).join('')}
      <tr><td colspan="5" class="right"><b>Tổng tiền</b></td><td class="right"><b>${fmtVND(tien)}</b></td></tr>
      </tbody></table></div>
    ${p.docstatus===0?`<div class="note">Phiếu do hệ thống sinh từ phiếu giao hàng của Miyano, đang ở trạng thái
      <b>nháp</b>. Tồn kho chỉ thay đổi khi thủ kho bấm <b>Ghi sổ</b>.</div>`:''}`
}

      <div><h2>${p.name}</h2><div class="sub">
        <span class="badge ${done?'b-green':'b-gray'}">${done?'Đã ghi sổ':'Nháp'}</span></div></div>
      <div class="flex">${done
        ? `<button class="btn-o btn-danger">Huỷ phiếu</button><button class="btn-o">⬇ In phiếu (PDF)</button>`
        : `<button class="btn" data-hl="btn-ghiso-px">Ghi sổ</button><button class="btn-o">Lưu nháp</button>`}
        <button class="btn-o">Quay lại</button></div></div>
    <div class="card">
      <div class="grid2" style="grid-template-columns:1fr 1fr">
        <div><div class="field"><label>Ngày</label><input value="${fmtDate(DEMO.homNay)}" ${done?'disabled':''}></div>
          <div class="field"><label>Loại xuất</label><select ${done?'disabled':''}><option>${p.loai}</option></select></div></div>
        <div><div class="field"><label>Nơi nhận</label><input value="${esc(p.noiNhan)}" ${done?'disabled':''}></div>
          <div class="field"><label>Người nhận</label><input value="${esc(p.nguoiNhan)}" ${done?'disabled':''}></div></div>
      </div>
    </div>
    <div class="card flush"><table>
      <thead><tr><th style="min-width:220px">Vật tư</th><th class="right">Tồn hiện có</th>
        <th style="width:150px" class="right">Số lượng xuất</th><th>Lô xuất</th></tr></thead>
      <tbody><tr>
        <td><b>MYN-GLOVE-M</b><br><span class="tag">${esc(VATTU['MYN-GLOVE-M'].ten)}</span></td>
        <td class="right">${fmtQty(tongTon(S,'MYN-GLOVE-M'))} Hộp</td>
        <td class="right"><div class="step" data-hl="px-sl"><button>−</button>
          <input value="${S.pxSL}" readonly><button>+</button></div></td>
        <td class="tag">theo gợi ý FEFO bên dưới</td>
      </tr></tbody></table></div>
    <div class="card" data-hl="fefo-panel">
      <div class="sb" style="margin-bottom:10px">
        <h3>Gợi ý lô theo FEFO — cần xuất ${fmtQty(S.pxSL)} Hộp</h3>
        ${g.thieu>0?`<span class="badge b-red">Thiếu ${fmtQty(g.thieu)} Hộp</span>`
                   :`<span class="badge b-green">Đủ tồn</span>`}
      </div>
      <table><thead><tr><th>Số lô</th><th>Hạn sử dụng</th><th class="right">Tồn lô</th>
        <th class="right">Đề xuất xuất</th><th class="right">Đơn giá</th></tr></thead>
        <tbody>${g.rows.map(r=>{const e=expiryInfo(r.han);return `<tr${r.deXuat>0?' style="background:#f0fdfa"':''}>
          <td><b>${r.lo}</b></td>
          <td>${r.han?`${fmtDate(r.han)}${e.label?` <span class="badge ${e.cls}" style="margin-left:6px">${e.icon} ${e.label}</span>`:''}`:'<span class="tag">Không thời hạn</span>'}</td>
          <td class="right">${fmtQty(r.sl)}</td>
          <td class="right">${r.deXuat>0?`<b>${fmtQty(r.deXuat)}</b>`:'<span class="tag">0</span>'}</td>
          <td class="right">${fmtVND(r.gia)}</td></tr>`}).join('')}
        </tbody></table>
      ${g.thieu>0?`<div class="note red">Không đủ tồn để xuất ${fmtQty(S.pxSL)} Hộp — còn thiếu
        <b>${fmtQty(g.thieu)} Hộp</b>. Gợi ý này <b>không chặn</b>; chốt chặn thật nằm ở bước ghi sổ.</div>`:''}
      ${coHetHan?`<label class="note" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer" data-hl="chk-hethan">
        <input type="checkbox" style="width:auto;margin-top:2px" ${S.pxXacNhanHetHan?'checked':''}>
        <span><b>Xác nhận xuất lô đã hết hạn.</b> Dòng phân bổ có lô <b>GL2504-A</b> đã quá hạn
        ${Math.abs(daysUntil('2026-07-16'))} ngày. Phải tích ô này thì mới ghi sổ được.</span></label>`:''}
    </div>
    ${done?`<div class="note gr">Đã ghi sổ. Sổ kho ghi thêm 3 dòng số lượng âm; tồn theo lô giảm tương ứng.
      Không dòng sổ nào bị sửa hay xoá.</div>`:''}`

function scModal(S){
  if(S.modal==='confirm') return `<div class="modal"><div class="card">
    <h3>Xác nhận gửi đơn hàng?</h3>
    <p style="font-size:13px;margin:10px 0">Đơn hàng theo <b>${DEMO.hdnt}</b>, tổng giá trị
      <b>${fmtVND(cartTotal(S))}</b> sẽ được gửi về hệ thống Supplycore của Miyano và tạo Đơn bán hàng
      (Sales Order) chờ xác nhận.</p>
    <div class="note">Bằng việc xác nhận, quý khách đồng ý đặt hàng theo đơn giá và điều khoản của
      Hợp đồng nguyên tắc đã ký.</div>
    <div class="flex" style="justify-content:flex-end;margin-top:14px">
      <button class="btn-o">Quay lại</button>
      <button class="btn" data-hl="btn-confirm">Xác nhận đặt hàng</button></div></div></div>`
  if(S.modal==='huy-pn') return `<div class="modal"><div class="card">
    <h3>Huỷ phiếu nhập ${DEMO.soPN}?</h3>
    <p style="font-size:13px;margin:10px 0">Phiếu đã ghi sổ. Huỷ phiếu <b>không xoá</b> dòng sổ nào —
      hệ thống sẽ sinh một <b>phiếu đảo</b> đã ghi sổ với số lượng ngược dấu và đánh dấu các dòng sổ gốc
      là đã bị đảo.</p>
    <div class="note">Đã kiểm: hàng của các lô trong phiếu này vẫn còn đủ trong kho, nên việc đảo không
      làm tồn xuống âm.</div>
    <div class="flex" style="justify-content:flex-end;margin-top:14px">
      <button class="btn-o">Quay lại</button>
      <button class="btn-o btn-danger" data-hl="btn-huy-xacnhan">Xác nhận huỷ phiếu</button></div></div></div>`
  return ''
}

const SCREENS = {
  catalog:scCatalog, cart:scCart, success:scSuccess, kho:scKho,
  'pn-list':scPNList, 'pn-detail':scPNDetail, 'px-detail':scPXDetail,
  'desk-so':scDeskSO, 'desk-dn':scDeskDN,
}

function render(){
  const st = STEPS[cur]
  const body = (SCREENS[S.screen]||(()=>'<div class="card">…</div>'))(S)
  const bar = S.chrome==='desk'
    ? `<div class="deskbar">🟤 <b>ERPNext Desk của Miyano</b> — nhân viên kinh doanh đang thao tác. Đây KHÔNG phải màn của bệnh viện.</div>`
    : `<div class="actorbar">🔵 <b>Cổng khách hàng</b> — ${esc(DEMO.khach)} đang thao tác tại <code>/portal</code></div>`
  document.getElementById('app').innerHTML =
    (S.chrome==='desk'?deskNavHTML(S):navHTML(S)) + bar + `<main class="main">${body}</main>` + scModal(S)

  // Toast
  document.getElementById('toast').innerHTML = S.toasts.map(t =>
    `<div class="toast ${t.kind==='err'?'err':'ok'}"><b>${esc(t.title)}</b>${esc(t.msg)}</div>`).join('')

  // Thanh hướng dẫn
  const total = STEPS.length
  document.getElementById('stepno').textContent = `BƯỚC ${cur+1}/${total}${st.mua&&st.mua!=='—'?' · '+st.mua:''}`
  const ac = document.getElementById('actor')
  ac.className = 'actor ' + st.act
  ac.textContent = st.act==='khach' ? 'Bệnh viện' : st.act==='miyano' ? 'Miyano' : 'Hệ thống'
  document.getElementById('title').textContent = st.title
  document.getElementById('desc').innerHTML = st.desc
    .replace('{{total}}', fmtVND(cartTotal(S)))
    .replace('{{thieu}}', fmtQty(S.pxThieu))
  document.getElementById('prog').style.width = ((cur+1)/total*100)+'%'
  document.getElementById('tip').innerHTML = st.tip
    ? `👉 Bấm <b>${esc(st.tip)}</b> trên giao diện` : '👀 Bước quan sát — bấm “Tiếp →”'
  document.getElementById('btnPrev').disabled = cur===0
  document.getElementById('btnNext').disabled = cur===total-1
  document.getElementById('jump').innerHTML = ['QT1','QT2','QT3','QT4','QT5']
    .map(m=>`<button data-jump="${m}" class="${st.mua===m?'on':''}">${m}</button>`).join('')

  // Chỉ dẫn bấm
  if(st.hl){
    const el = document.querySelector(`[data-hl="${st.hl}"]`)
    if(el){
      el.classList.add('hl')
      el.addEventListener('click', next, {once:true})
      el.scrollIntoView({block:'center', behavior:'instant'})
      // Nhãn "bấm vào đâu" nằm trong thanh hướng dẫn chứ KHÔNG nổi trên giao
      // diện: một nhãn nổi luôn che mất chính ô dữ liệu mà bước đang nói tới
      // (đã thử cả bốn phía). Viền xanh nhấp nháy đủ để chỉ chỗ.
    }
  }
  const q = new URL(location.href); q.searchParams.set('step', cur+1)
  history.replaceState(null,'',q)
}

function rebuild(n){
  S = initState()
  for(let i=0; i<=n; i++){
    // Giữ lại toast do bước LIỀN TRƯỚC sinh ra (thông báo chặn/thành công là
    // kết quả của cú bấm vừa rồi), xoá toast của mọi bước cũ hơn. Nếu xoá cả
    // của bước n-1 thì mở thẳng bằng ?step=N sẽ mất luôn thông báo bị chặn.
    if(i < n) S.toasts = []
    if(STEPS[i].chrome) S.chrome = STEPS[i].chrome
    if(STEPS[i].screen) S.screen = STEPS[i].screen
    S.modal = STEPS[i].modal || null
    STEPS[i].apply?.(S)
    if(i < n) STEPS[i].onClick?.(S)     // bước đã qua thì coi như đã bấm
  }
  cur = n
  document.querySelectorAll('.hl-tip').forEach(e=>e.remove())
  render()
}
function next(){
  if(cur >= STEPS.length-1) return
  STEPS[cur].onClick?.(S)
  cur++
  document.querySelectorAll('.hl-tip').forEach(e=>e.remove())
  const st = STEPS[cur]
  if(st.chrome) S.chrome = st.chrome
  if(st.screen) S.screen = st.screen
  S.modal = st.modal || null
  st.apply?.(S)
  render()
}
function prev(){ if(cur>0) rebuild(cur-1) }

document.getElementById('btnNext').onclick = next
document.getElementById('btnPrev').onclick = prev
document.getElementById('jump').onclick = e => {
  const m = e.target.dataset.jump
  if(m){ const i = STEPS.findIndex(s=>s.mua===m); if(i>=0) rebuild(i) }
}
window.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); next() }
  if(e.key==='ArrowLeft') { e.preventDefault(); prev() }
})

// ?step=N — mở thẳng vào một bước, tiện khi đào tạo hoặc gửi link cho nhau.
const want = parseInt(new URL(location.href).searchParams.get('step')||'1', 10)
rebuild(Math.min(Math.max(want,1), STEPS.length) - 1)
</script>
